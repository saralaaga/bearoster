<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Birthday app logo</title>
  <desc id="desc">Two tilted contact cards with a profile glyph and text lines.</desc>
  <defs>
    <style>
      .back { fill: #F5A623; }
      .front { fill: #DCDCE1; stroke: #C7C7CF; stroke-width: 6; }
      .glyph { fill: #1B2A4A; }
    </style>
  </defs>

  <g transform="rotate(-11 470 530)">
