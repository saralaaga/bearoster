  </g>

  <g transform="rotate(6 560 540)">
    <rect class="front" x="300" y="240" width="520" height="640" rx="95"/>

    <circle class="glyph" cx="560" cy="445" r="88"/>
    <path class="glyph" d="M 460 640
                           C 460 560 505 520 560 520
                           C 615 520 660 560 660 640
                           C 660 655 650 662 638 662
                           L 482 662
                           C 470 662 460 655 460 640 Z"/>

    <rect class="glyph" x="452" y="706" width="240" height="36" rx="18"/>
    <rect class="glyph" x="452" y="768" width="168" height="36" rx="18"/>
  </g>
</svg>
