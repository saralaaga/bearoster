<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日簿</title>
<style>
:root{
  --bg-window:#FFFFFF;
  --bg-sidebar:rgba(238,238,238,.72);
  --bg-sidebar-solid:#EEEEEE;
  --bg-under:#F5F5F7;
  --label:#1D1D1F;
  --label-2:#6E6E73;
  --label-3:#8E8E93;
  --sep:rgba(60,60,67,.12);
  --sep-strong:rgba(60,60,67,.18);
  --accent:#007AFF;
  --red:#FF3B30;
  --fill:rgba(120,120,128,.16);
  --fill-2:rgba(120,120,128,.24);
  --card:#FFFFFF;
  --toolbar:rgba(246,246,246,.8);
  --r-win:14px; --r-card:10px; --r-ctl:6px;
  --shadow-win:0 22px 70px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--label);
  background:
    radial-gradient(900px 600px at 15% 0%, #DDE4F0 0%, transparent 55%),
    radial-gradient(800px 600px at 90% 100%, #F3E3DC 0%, transparent 50%),
    #E8E8EC;
  display:flex;align-items:center;justify-content:center;padding:32px 24px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--label)}

/* ── window ─────────────────────────────── */
.window{
  width:min(1180px,100%);height:min(780px,100%);
  background:var(--bg-window);
  border-radius:var(--r-win);
  box-shadow:var(--shadow-win);
  display:flex;flex-direction:column;overflow:hidden;
}

/* unified toolbar */
.toolbar{
  flex:none;display:flex;align-items:center;gap:10px;
  height:52px;padding:0 14px;
  background:var(--toolbar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep-strong);
}
.traffic{display:flex;gap:8px;margin-right:4px}
.traffic span{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.traffic .c1{background:#FF5F57}.traffic .c2{background:#FEBC2E}.traffic .c3{background:#28C840}
.tb-title{font-size:14px;font-weight:600}
.tb-spacer{flex:1}
.search-box{
  display:flex;align-items:center;gap:5px;
  background:var(--fill);border-radius:var(--r-ctl);
  padding:4px 9px;width:200px;transition:.15s;
}
.search-box:focus-within{box-shadow:0 0 0 3.5px rgba(0,122,255,.35);background:#fff}
.search-box svg{flex:none;color:var(--label-3)}
.search-box input{border:none;background:none;outline:none;font-size:13px;width:100%}
.search-box input::placeholder{color:var(--label-3)}
.btn-mac{
  font-size:13px;font-weight:500;padding:4px 12px;
  background:#fff;border:.5px solid var(--sep-strong);border-radius:var(--r-ctl);
  box-shadow:0 .5px 1.5px rgba(0,0,0,.08);
  transition:.12s;display:flex;align-items:center;gap:4px;
}
.btn-mac:active{background:#E8E8E8;box-shadow:none}
.btn-mac.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn-mac.primary:active{background:#0062CC}

/* ── body ───────────────────────────────── */
.app-body{flex:1;display:flex;min-height:0}

/* sidebar: macOS source list */
.sidebar{
  width:220px;flex:none;
  background:var(--bg-sidebar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-right:.5px solid var(--sep-strong);
  padding:10px 8px;overflow-y:auto;
}
.side-head{
  font-size:11px;font-weight:600;color:var(--label-2);
  padding:12px 10px 4px;
}
.side-item{
  display:flex;align-items:center;gap:7px;width:100%;
  padding:4px 8px;border-radius:var(--r-ctl);
  font-size:13px;color:var(--label);text-align:left;
}
.side-item .cnt{margin-left:auto;font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums}
.side-item.active{background:var(--fill-2)}
.side-item:hover:not(.active){background:rgba(120,120,128,.1)}
.sf{
  width:16px;height:16px;flex:none;border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.sf svg{display:block}
.group-dot{width:11px;height:11px;border-radius:50%;flex:none;margin:0 2.5px}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-window)}
.view{flex:1;display:flex;min-height:0}

/* ── contacts ───────────────────────────── */
.contact-list{
  width:300px;flex:none;border-right:.5px solid var(--sep-strong);
  overflow-y:auto;background:var(--bg-window);
}
.cl-head{
  position:sticky;top:0;z-index:2;
  background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:14px 16px 8px;border-bottom:.5px solid var(--sep);
}
.cl-head h2{font-size:20px;font-weight:700}
.cl-head span{font-size:12px;color:var(--label-2)}
.c-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 16px;text-align:left;
}
.c-item.active{background:var(--accent);color:#fff}
.c-item.active .c-sub,.c-item.active .c-days{color:rgba(255,255,255,.75)}
.c-item:hover:not(.active){background:rgba(120,120,128,.08)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#fff;
}
.c-meta{min-width:0;flex:1}
.c-name{font-size:13.5px;font-weight:500}
.c-sub{font-size:11.5px;color:var(--label-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-days{font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums;flex:none}
.c-days.soon{color:var(--red);font-weight:600}

/* detail */
.detail{flex:1;min-width:0;overflow-y:auto;background:var(--bg-under);padding:36px 32px 60px}
.detail-inner{max-width:560px;margin:0 auto}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--label-3);background:var(--bg-under)}
.d-hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.d-avatar{
  width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:500;color:#fff;margin-bottom:12px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.08));
}
.d-name{font-size:24px;font-weight:700}
.d-tagline{font-size:13px;color:var(--label-2);margin-top:3px}
.countdown-banner{
  background:var(--card);border-radius:var(--r-card);
  box-shadow:0 .5px 2px rgba(0,0,0,.06), 0 0 0 .5px var(--sep);
  padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;
}
.countdown-banner.today{background:var(--red);color:#fff}
.countdown-banner.today .cd-label{color:rgba(255,255,255,.8)}
.cd-num{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cd-label{font-size:12px;color:var(--label-2);margin-top:2px}
.cd-cake{margin-left:auto;opacity:.6}
.card{
  background:var(--card);border-radius:var(--r-card);
  box-shadow:0 .5px 2px rgba(0,0,0,.06), 0 0 0 .5px var(--sep);
  margin-bottom:18px;overflow:hidden;
}
.row{
  display:flex;align-items:center;min-height:44px;
  padding:8px 16px;gap:16px;
}
.row + .row{border-top:.5px solid var(--sep)}
.row-label{width:64px;flex:none;font-size:13px;color:var(--label-2);text-align:right}
.row-value{flex:1;font-size:14px;min-width:0}
.row-value .placeholder{color:var(--label-3)}
.f-input{
  width:100%;border:none;outline:none;background:transparent;
  font-size:14px;padding:4px 0;resize:none;
}
.f-input:focus{background:rgba(0,122,255,.06);border-radius:4px}
select.f-input{appearance:none;cursor:pointer}
.d-actions{display:flex;justify-content:center;gap:10px}
.btn{
  font-size:13px;font-weight:500;padding:6px 18px;border-radius:var(--r-ctl);
  background:#fff;border:.5px solid var(--sep-strong);
  box-shadow:0 .5px 1.5px rgba(0,0,0,.08);transition:.12s;
}
.btn:active{background:#E8E8E8;box-shadow:none}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:active{background:#0062CC}
.btn.destructive{color:var(--red)}
.btn.destructive:active{background:#FBEAE9}

/* ── calendar ───────────────────────────── */
.cal-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-window)}
.cal-head{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:14px 20px 10px;flex-wrap:wrap;
}
.cal-title{font-size:22px;font-weight:700}
.cal-title small{font-size:13px;font-weight:400;color:var(--label-2);margin-left:8px}
.cal-nav{display:flex;margin-left:auto}
.cal-nav button{
  width:30px;height:24px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:.5px solid var(--sep-strong);color:var(--label-2);
}
.cal-nav button:first-child{border-radius:var(--r-ctl) 0 0 var(--r-ctl)}
.cal-nav button:last-child{border-radius:0 var(--r-ctl) var(--r-ctl) 0;border-left:none}
.cal-nav button:active{background:#E8E8E8}
.btn-today{font-size:13px;font-weight:500;color:var(--accent);padding:4px 10px;border-radius:var(--r-ctl)}
.btn-today:active{background:rgba(0,122,255,.1)}
.cal-week{
  flex:none;display:grid;grid-template-columns:repeat(7,1fr);
  border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep-strong);
  background:#FAFAFA;
}
.cal-week div{font-size:11px;font-weight:600;color:var(--label-2);text-align:right;padding:5px 8px}
.cal-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  flex:none;border-bottom:.5px solid var(--sep);
}
.cal-cell{
  min-height:96px;padding:5px 6px 6px;text-align:right;
  border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);
  cursor:pointer;display:flex;flex-direction:column;gap:3px;background:#fff;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:rgba(0,122,255,.04)}
.cal-cell.dim{background:#FAFAFA;cursor:default}
.cal-cell.dim:hover{background:#FAFAFA}
.cal-cell.is-sel{background:rgba(0,122,255,.08)}
.day-num{
  font-size:13px;color:var(--label);font-variant-numeric:tabular-nums;
  width:22px;height:22px;margin-left:auto;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.cal-cell.dim .day-num{color:var(--label-3)}
.cal-cell.is-today .day-num{background:var(--red);color:#fff;font-weight:600}
.day-events{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ev-chip{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:500;text-align:left;
  padding:2px 6px;border-radius:4px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ev-chip i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);flex:none}
.cal-day-panel{
  flex:none;border-top:.5px solid var(--sep-strong);
  background:#FAFAFA;padding:12px 20px 16px;display:none;
}
.cal-day-panel.show{display:block}
.cdp-title{font-size:13px;font-weight:600;margin-bottom:8px}
.cdp-empty{font-size:13px;color:var(--label-3)}
.cdp-person{display:flex;align-items:center;gap:10px;padding:6px 0}
.cdp-person + .cdp-person{border-top:.5px solid var(--sep)}
.cdp-name{font-size:13.5px;font-weight:500}
.cdp-sub{font-size:12px;color:var(--label-2)}
.cdp-age{margin-left:auto;font-size:12px;color:var(--label-2)}

/* ── upcoming ───────────────────────────── */
.upcoming-wrap{flex:1;overflow-y:auto;background:var(--bg-under);padding:24px 28px 60px}
.up-inner{max-width:640px;margin:0 auto}
.up-inner h2{font-size:22px;font-weight:700;margin-bottom:4px}
.up-inner .sub{font-size:13px;color:var(--label-2);margin-bottom:18px}
.up-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 14px;text-align:left;background:transparent;
}
.up-item:active{background:rgba(120,120,128,.08)}
.up-item + .up-item{border-top:.5px solid var(--sep)}
.up-date{flex:none;width:44px;text-align:center}
.up-date b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.up-date span{font-size:11px;color:var(--label-2)}
.up-name{font-size:14px;font-weight:500}
.up-sub{font-size:12px;color:var(--label-2);margin-top:1px}
.up-badge{margin-left:auto;font-size:12px;color:var(--label-2);font-variant-numeric:tabular-nums}
.up-badge.today{color:var(--red);font-weight:600}

/* mobile tab bar */
.tabbar{display:none}

/* ── responsive: iOS ────────────────────── */
@media (max-width:820px){
  body{padding:0;align-items:stretch;background:#fff}
  .window{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .traffic{display:none}
  .toolbar{height:50px;background:rgba(248,248,248,.85)}
  .tb-title{font-size:17px}
  .search-box{flex:1;min-width:0;width:auto;border-radius:10px;padding:6px 9px}
  .btn-add-txt{display:none}
  .sidebar{display:none}
  .contact-list{width:100%;border-right:none}
  .contact-list.hide-m{display:none}
  .c-item.active{background:transparent;color:inherit}
  .c-item.active .c-sub,.c-item.active .c-days{color:var(--label-2)}
  .c-item.active .c-days.soon{color:var(--red)}
  .cl-head{background:rgba(255,255,255,.85)}
  .cl-head h2{font-size:28px;font-weight:800;letter-spacing:.01em}
  .detail{display:none;position:fixed;inset:0;z-index:40;background:var(--bg-under);padding:calc(54px + env(safe-area-inset-top)) 16px 100px}
  .detail.show-m{display:block}
  .m-back{
    display:flex;align-items:center;gap:2px;
    position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:41;
    font-size:17px;color:var(--accent);padding:8px 10px 8px 4px;
  }
  .detail-empty{display:none}
  .cal-head{padding:12px 16px 8px}
  .cal-cell{min-height:72px;padding:4px}
  .day-num{width:20px;height:20px;font-size:12px}
  .ev-chip{font-size:10px;padding:1px 4px}
  .ev-chip .ev-txt{display:none}
  .ev-chip i{width:6px;height:6px}
  .ev-chip{background:transparent !important;padding:1px 2px}
  .ev-chip i{background:var(--ev,#999);width:8px;height:8px}
  .upcoming-wrap{padding:16px 16px 110px}
  .up-inner h2{font-size:28px;font-weight:800}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(248,248,248,.9);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--sep-strong);
    padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  }
  .tab-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;color:var(--label-3);padding:6px 0 2px;
  }
  .tab-item.active{color:var(--accent)}
  .main{padding-bottom:56px}
}
@media (min-width:821px){.m-back{display:none}}
::selection{background:rgba(0,122,255,.25)}
</style>
</head>
<body>

<div class="window">
  <!-- unified toolbar -->
  <div class="toolbar">
    <div class="traffic"><span class="c1"></span><span class="c2"></span><span class="c3"></span></div>
    <div class="tb-title">生日簿</div>
    <div class="tb-spacer"></div>
    <label class="search-box">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索">
    </label>
    <button class="btn-mac primary" onclick="addContact()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-add-txt">添加</span>
    </button>
  </div>

  <div class="app-body">
    <!-- source list -->
    <nav class="sidebar">
      <div class="side-head">资料库</div>
      <button class="side-item active" data-view="contacts" onclick="setView('contacts')">
        <span class="sf" style="background:#007AFF"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M15.5 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        通讯录<span class="cnt" id="cntAll">0</span>
      </button>
      <button class="side-item" data-view="calendar" onclick="setView('calendar')">
        <span class="sf" style="background:#FF3B30"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        日历
      </button>
      <button class="side-item" data-view="upcoming" onclick="setView('upcoming')">
        <span class="sf" style="background:#FF9500"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg></span>
        即将生日<span class="cnt" id="cntSoon">0</span>
      </button>
      <div class="side-head">分组</div>
      <div id="groupList"></div>
    </nav>

    <!-- main -->
    <main class="main">
      <section class="view" id="view-contacts">
        <div class="contact-list" id="contactListWrap">
          <div class="cl-head"><h2>通讯录</h2><span id="listCount"></span></div>
          <div id="contactList"></div>
        </div>
        <div class="detail" id="detailPanel"></div>
      </section>

      <section class="view" id="view-calendar" style="display:none">
        <div class="cal-wrap">
          <div class="cal-head">
            <div class="cal-title" id="calTitle"></div>
            <div class="cal-nav">
              <button onclick="calMove(-1)" aria-label="上个月"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
              <button onclick="calMove(1)" aria-label="下个月"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
            <button class="btn-today" onclick="calToday()">今天</button>
          </div>
          <div class="cal-week"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div>
          <div class="cal-scroll">
            <div class="cal-grid" id="calGrid"></div>
            <div class="cal-day-panel" id="calDayPanel" style="flex:1"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-upcoming" style="display:none">
        <div class="upcoming-wrap">
          <div class="up-inner">
            <h2>即将生日</h2>
            <div class="sub">按临近程度排序</div>
            <div class="card" id="upcomingCard"><div id="upcomingList"></div></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- iOS tab bar -->
  <nav class="tabbar">
    <button class="tab-item active" data-view="contacts" onclick="setView('contacts')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M15.5 3.13a4 4 0 0 1 0 7.75"/></svg>
      通讯录
    </button>
    <button class="tab-item" data-view="calendar" onclick="setView('calendar')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      日历
    </button>
    <button class="tab-item" data-view="upcoming" onclick="setView('upcoming')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg>
      即将生日
    </button>
  </nav>
</div>

<script>
/* ── data ─────────────────────────────────── */
const AV_COLORS = ['#5E5CE6','#FF9F0A','#32ADE6','#FF453A','#BF5AF2','#64D2FF','#FF6482','#30D158'];
const GROUP_COLORS = {'家人':'#FF453A','朋友':'#FF9F0A','同事':'#32ADE6','同学':'#BF5AF2'};

let contacts = [
  {id:1, name:'林小满', birthday:'1991-08-12', group:'家人', phone:'138 2211 0098', email:'xiaoman@mail.com', note:'喜欢向日葵，蛋糕要芒果味', avatar:0},
  {id:2, name:'陈以安', birthday:'1988-08-15', group:'朋友', phone:'136 8877 2233', email:'', note:'大学室友，爱喝手冲咖啡', avatar:1},
  {id:3, name:'苏念',   birthday:'1995-08-26', group:'同事', phone:'', email:'sunian@work.com', note:'设计组，养了一只橘猫', avatar:4},
  {id:4, name:'周屿',   birthday:'1990-09-03', group:'朋友', phone:'139 0055 6677', email:'', note:'', avatar:2},
  {id:5, name:'母亲',   birthday:'1963-09-18', group:'家人', phone:'137 1122 3344', email:'', note:'记得提前订花', avatar:6},
  {id:6, name:'阿禾',   birthday:'1998-10-02', group:'同学', phone:'', email:'', note:'高中同桌，现在在大理', avatar:5},
  {id:7, name:'沈知遥', birthday:'1993-10-21', group:'同事', phone:'135 9988 1100', email:'shenzy@work.com', note:'', avatar:2},
  {id:8, name:'父亲',   birthday:'1960-11-05', group:'家人', phone:'137 1122 3355', email:'', note:'血压偏高，别买太甜的', avatar:0},
  {id:9, name:'顾清',   birthday:'1996-12-24', group:'朋友', phone:'', email:'guqing@mail.com', note:'平安夜生日，总在聚会中度过', avatar:3},
  {id:10,name:'陆则明', birthday:'1987-01-30', group:'同事', phone:'138 7766 5544', email:'', note:'', avatar:1},
  {id:11,name:'外婆',   birthday:'1942-03-08', group:'家人', phone:'', email:'', note:'喜欢热闹，多打电话', avatar:6},
  {id:12,name:'季云开', birthday:'1994-05-16', group:'同学', phone:'139 3344 7788', email:'', note:'', avatar:5},
];
let nextId = 13;

const state = {
  view:'contacts', selectedId:1, editing:false, isNew:false,
  groupFilter:null, search:'',
  cal:{y:new Date().getFullYear(), m:new Date().getMonth()},
  calSel:null,
};

/* ── helpers ──────────────────────────────── */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function parseBD(s){ const [y,m,d]=s.split('-').map(Number); return {y,m,d}; }
function nextBirthday(c){
  const {m,d} = parseBD(c.birthday);
  const now = new Date(); const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let t = new Date(now.getFullYear(), m-1, d);
  if(t < today) t = new Date(now.getFullYear()+1, m-1, d);
  return t;
}
function daysUntil(c){
  const now = new Date(); const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((nextBirthday(c)-today)/86400000);
}
function turningAge(c){ return nextBirthday(c).getFullYear()-parseBD(c.birthday).y; }
function fmtDate(s){ const {y,m,d}=parseBD(s); return `${y}年${m}月${d}日`; }
function avatarColor(c){ return AV_COLORS[c.avatar % AV_COLORS.length]; }
function initialOf(name){ return name.replace(/^(母亲|父亲|外婆|外公|爷爷|奶奶)/,'').charAt(0) || name.charAt(0); }

function visibleContacts(){
  return contacts.filter(c=>{
    if(state.groupFilter && c.group!==state.groupFilter) return false;
    if(state.search && !c.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>daysUntil(a)-daysUntil(b));
}

/* ── view switching ───────────────────────── */
function setView(v){
  state.view = v;
  document.querySelectorAll('.view').forEach(el=>el.style.display='none');
  $('#view-'+v).style.display='flex';
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  if(v==='contacts') renderContacts();
  if(v==='calendar') renderCalendar();
  if(v==='upcoming') renderUpcoming();
  if(v==='contacts') closeDetailMobile();
}

/* ── contacts list ────────────────────────── */
function updateCounts(){
  $('#cntAll').textContent = contacts.length;
  $('#cntSoon').textContent = contacts.filter(c=>daysUntil(c)<=30).length;
}
function renderContacts(){
  const list = visibleContacts();
  updateCounts();
  $('#listCount').textContent = list.length + ' 位联系人';
  renderGroups();

  const wrap = $('#contactList');
  if(!list.length){ wrap.innerHTML = '<div style="padding:28px 16px;font-size:13px;color:var(--label-3)">无结果</div>'; }
  else{
    wrap.innerHTML = list.map(c=>{
      const du = daysUntil(c);
      const badge = du===0 ? '<span class="c-days soon">今天</span>'
        : `<span class="c-days ${du<=7?'soon':''}">${du} 天后</span>`;
      return `<button class="c-item ${c.id===state.selectedId?'active':''}" onclick="selectContact(${c.id})">
        <span class="avatar" style="background:${avatarColor(c)}">${initialOf(c.name)}</span>
        <span class="c-meta">
          <span class="c-name">${c.name}</span>
          <div class="c-sub">${parseBD(c.birthday).m}月${parseBD(c.birthday).d}日 · ${c.group}</div>
        </span>${badge}</button>`;
    }).join('');
  }
  renderDetail();
}

function renderGroups(){
  const groups = {};
  contacts.forEach(c=>groups[c.group]=(groups[c.group]||0)+1);
  let html = `<button class="side-item ${state.groupFilter===null?'active':''}" onclick="filterGroup(null)">
    <span class="group-dot" style="background:#8E8E93"></span>全部<span class="cnt">${contacts.length}</span></button>`;
  html += Object.keys(groups).map(g=>`
    <button class="side-item ${state.groupFilter===g?'active':''}" onclick="filterGroup('${g}')">
      <span class="group-dot" style="background:${GROUP_COLORS[g]||'#8E8E93'}"></span>${g}<span class="cnt">${groups[g]}</span></button>`).join('');
  $('#groupList').innerHTML = html;
}
function filterGroup(g){ state.groupFilter = g; renderContacts(); }

function selectContact(id){
  state.selectedId = id; state.editing=false; state.isNew=false;
  renderContacts();
  $('#detailPanel').classList.add('show-m');
  $('#contactListWrap').classList.add('hide-m');
  renderBackBtn(true);
}
function closeDetailMobile(){
  $('#detailPanel').classList.remove('show-m');
  $('#contactListWrap').classList.remove('hide-m');
  renderBackBtn(false);
}
function renderBackBtn(show){
  let btn = document.querySelector('.m-back');
  if(show && !btn){
    btn = document.createElement('button');
    btn.className='m-back';
    btn.innerHTML='<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg> 通讯录';
    btn.onclick=closeDetailMobile;
    document.body.appendChild(btn);
  } else if(!show && btn){ btn.remove(); }
}

/* ── detail ───────────────────────────────── */
function rowItem(label, valueHtml){
  return `<div class="row"><span class="row-label">${label}</span><div class="row-value">${valueHtml}</div></div>`;
}
function renderDetail(){
  const c = contacts.find(x=>x.id===state.selectedId);
  const panel = $('#detailPanel');
  if(!c){
    panel.innerHTML = `<div class="detail-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/></svg>
      <div style="font-size:13px">未选择联系人</div></div>`;
    return;
  }
  const du = daysUntil(c), age = turningAge(c), bd = parseBD(c.birthday);
  const ed = state.editing;
  const ph = t => `<span class="placeholder">${t}</span>`;

  const banner = du===0
    ? `<div class="countdown-banner today">
        <div><div class="cd-num">今天</div><div class="cd-label">${c.name} 的 ${age} 岁生日</div></div>
        <svg class="cd-cake" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z"/><path d="M4 13c1.3 1.6 2.7 1.6 4 0s2.7-1.6 4 0 2.7 1.6 4 0 2.7-1.6 4 0M8 5.5V9M12 5.5V9M16 5.5V9"/></svg>
      </div>`
    : `<div class="countdown-banner">
        <div><div class="cd-num">${du} <span style="font-size:13px;font-weight:500;color:var(--label-2)">天后</span></div><div class="cd-label">${bd.m}月${bd.d}日 · 满 ${age} 岁</div></div>
        <svg class="cd-cake" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z"/><path d="M4 13c1.3 1.6 2.7 1.6 4 0s2.7-1.6 4 0 2.7 1.6 4 0 2.7-1.6 4 0M8 5.5V9M12 5.5V9M16 5.5V9"/></svg>
      </div>`;

  const infoRows = ed
    ? rowItem('姓名', `<input class="f-input" id="f-name" value="${c.name}" placeholder="必填">`)
      + rowItem('生日', `<input class="f-input" id="f-birthday" type="date" value="${c.birthday}">`)
      + rowItem('分组', `<select class="f-input" id="f-group">${Object.keys(GROUP_COLORS).map(g=>`<option ${g===c.group?'selected':''}>${g}</option>`).join('')}</select>`)
    : rowItem('生日', fmtDate(c.birthday))
      + rowItem('分组', c.group);

  const contactRows = ed
    ? rowItem('电话', `<input class="f-input" id="f-phone" value="${c.phone}" placeholder="选填">`)
      + rowItem('邮箱', `<input class="f-input" id="f-email" value="${c.email}" placeholder="选填">`)
    : rowItem('电话', c.phone || ph('未填写'))
      + rowItem('邮箱', c.email || ph('未填写'));

  const noteRows = ed
    ? `<div class="row" style="align-items:flex-start"><span class="row-label" style="padding-top:5px">备注</span><div class="row-value"><textarea class="f-input" id="f-note" rows="3" placeholder="喜好、礼物灵感、提醒事项…">${c.note}</textarea></div></div>`
    : `<div class="row" style="align-items:flex-start"><span class="row-label" style="padding-top:2px">备注</span><div class="row-value">${c.note || ph('未填写')}</div></div>`;

  panel.innerHTML = `
    <div class="detail-inner">
      <div class="d-hero">
        <div class="d-avatar" style="background-color:${avatarColor(c)}">${initialOf(c.name)}</div>
        <div class="d-name">${ed ? (state.isNew?'新联系人':'编辑联系人') : c.name}</div>
        ${ed ? '' : `<div class="d-tagline">${c.group}</div>`}
      </div>
      ${banner}
      <div class="card">${infoRows}</div>
      <div class="card">${contactRows}</div>
      <div class="card">${noteRows}</div>
      <div class="d-actions">
        ${ed
          ? `<button class="btn primary" onclick="saveContact()">完成</button>
             <button class="btn" onclick="cancelEdit()">取消</button>`
          : `<button class="btn primary" onclick="startEdit()">编辑</button>
             <button class="btn destructive" onclick="deleteContact()">删除联系人</button>`}
      </div>
    </div>`;
}

function startEdit(){ state.editing=true; renderDetail(); }
function cancelEdit(){
  if(state.isNew){ contacts = contacts.filter(c=>c.id!==state.selectedId); state.selectedId = contacts[0]?.id ?? null; state.isNew=false; }
  state.editing=false; renderContacts();
}
function saveContact(){
  const c = contacts.find(x=>x.id===state.selectedId);
  const name = $('#f-name').value.trim();
  const bd = $('#f-birthday').value;
  if(!name){ alert('请填写姓名'); return; }
  if(!bd){ alert('请选择生日'); return; }
  c.name = name; c.birthday = bd;
  c.group = $('#f-group').value;
  c.phone = $('#f-phone').value.trim();
  c.email = $('#f-email').value.trim();
  c.note = $('#f-note').value.trim();
  state.editing=false; state.isNew=false;
  renderContacts();
}
function deleteContact(){
  const c = contacts.find(x=>x.id===state.selectedId);
  if(!c) return;
  if(!confirm(`确定删除“${c.name}”吗？`)) return;
  contacts = contacts.filter(x=>x.id!==c.id);
  state.selectedId = contacts[0]?.id ?? null;
  state.editing=false;
  renderContacts();
  closeDetailMobile();
}
function addContact(){
  const c = {id:nextId++, name:'', birthday:'2000-01-01', group:'朋友', phone:'', email:'', note:'', avatar:Math.floor(Math.random()*AV_COLORS.length)};
  contacts.push(c);
  state.selectedId=c.id; state.editing=true; state.isNew=true;
  setView('contacts');
  $('#detailPanel').classList.add('show-m');
  $('#contactListWrap').classList.add('hide-m');
  renderBackBtn(true);
  setTimeout(()=>$('#f-name')?.focus(), 60);
}

/* ── calendar ─────────────────────────────── */
function renderCalendar(){
  const {y,m} = state.cal;
  $('#calTitle').innerHTML = `${y}年${MONTHS[m]} <small>${birthdaysInMonth(y,m).length} 个生日</small>`;
  const first = new Date(y,m,1);
  let startDay = (first.getDay()+6)%7;
  const dimDate = new Date(y,m+1,0).getDate();
  const prevDim = new Date(y,m,0).getDate();
  const today = new Date();
  const cells = [];
  for(let i=0;i<42;i++){
    const dayNum = i-startDay+1;
    if(dayNum<1) cells.push({n:prevDim+dayNum, dim:true});
    else if(dayNum>dimDate) cells.push({n:dayNum-dimDate, dim:true});
    else cells.push({n:dayNum, dim:false});
  }
  $('#calGrid').innerHTML = cells.map(cell=>{
    if(cell.dim) return `<div class="cal-cell dim"><span class="day-num">${cell.n}</span></div>`;
    const dateStr = `${y}-${pad(m+1)}-${pad(cell.n)}`;
    const people = contacts.filter(c=>{ const b=parseBD(c.birthday); return b.m===m+1 && b.d===cell.n; });
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===cell.n;
    const isSel = state.calSel===dateStr;
    return `<div class="cal-cell ${isToday?'is-today':''} ${isSel?'is-sel':''}" onclick="selectDay('${dateStr}')">
      <span class="day-num">${cell.n}</span>
      <div class="day-events">${people.map(p=>`<span class="ev-chip" style="background:${avatarColor(p)};--ev:${avatarColor(p)}" title="${p.name}"><i></i><span class="ev-txt">${p.name}</span></span>`).join('')}</div>
    </div>`;
  }).join('');
  if(state.calSel) renderDayPanel(); else $('#calDayPanel').classList.remove('show');
}
function birthdaysInMonth(y,m){ return contacts.filter(c=>parseBD(c.birthday).m===m+1); }
function selectDay(ds){ state.calSel = ds; renderCalendar(); }
function renderDayPanel(){
  const [y,m,d] = state.calSel.split('-').map(Number);
  const people = contacts.filter(c=>{ const b=parseBD(c.birthday); return b.m===m && b.d===d; });
  const panel = $('#calDayPanel');
  panel.classList.add('show');
  panel.innerHTML = `<div class="cdp-title">${m}月${d}日</div>` +
    (people.length
      ? people.map(p=>{
          const age = y - parseBD(p.birthday).y;
          return `<div class="cdp-person">
            <span class="avatar" style="background:${avatarColor(p)};width:30px;height:30px;font-size:12px">${initialOf(p.name)}</span>
            <span><div class="cdp-name">${p.name}</div><div class="cdp-sub">${p.group}</div></span>
            <span class="cdp-age">满 ${age} 岁</span></div>`;
        }).join('')
      : '<div class="cdp-empty">这一天没有生日。</div>');
}
function calMove(delta){
  let {y,m} = state.cal;
  m += delta;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  state.cal = {y,m}; state.calSel=null;
  renderCalendar();
}
function calToday(){
  const t = new Date();
  state.cal = {y:t.getFullYear(), m:t.getMonth()};
  state.calSel = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  renderCalendar();
}

/* ── upcoming ─────────────────────────────── */
function renderUpcoming(){
  const sorted = [...contacts].sort((a,b)=>daysUntil(a)-daysUntil(b)).slice(0,8);
  $('#upcomingList').innerHTML = sorted.map(c=>{
    const du = daysUntil(c), nb = nextBirthday(c);
    return `<button class="up-item" onclick="selectContact(${c.id});setView('contacts')">
      <div class="up-date"><b>${nb.getDate()}</b><span>${nb.getMonth()+1}月</span></div>
      <span class="avatar" style="background:${avatarColor(c)}">${initialOf(c.name)}</span>
      <span style="flex:1;min-width:0"><div class="up-name">${c.name}</div><div class="up-sub">${c.group} · 满 ${turningAge(c)} 岁</div></span>
      <span class="up-badge ${du===0?'today':''}">${du===0?'今天':du+' 天后'}</span>
    </button>`;
  }).join('');
}

/* ── search ───────────────────────────────── */
$('#searchInput').addEventListener('input', e=>{
  state.search = e.target.value;
  if(state.view!=='contacts') setView('contacts'); else renderContacts();
});

/* ── init ─────────────────────────────────── */
updateCounts(); renderGroups();
const hashView = location.hash.replace('#','');
if(['contacts','calendar','upcoming'].includes(hashView)) setView(hashView);
else renderContacts();
</script>
</body>
</html>
