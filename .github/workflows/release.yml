name: App Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version being released (must match Packaging/VERSION)"
        required: true

permissions:
  contents: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  # Unprivileged job: no secrets, builds the candidate the reviewer approves.
  candidate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Match version input to the checked-out tree
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          source Packaging/VERSION
          if [ "$ROSTER_MARKETING_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Packaging/VERSION says $ROSTER_MARKETING_VERSION but dispatch asked for $EXPECTED_VERSION" >&2
            exit 1
          fi
      - name: Test
        run: swift test --scratch-path "$PWD/.build"
      - name: Build ad-hoc release candidate
        run: scripts/release/build-release-artifact.sh direct
      - name: Show manifest
        run: find release/artifacts -name manifest.txt -exec cat {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/artifacts/
          retention-days: 14

  # Privileged job: runs only after the required reviewer (you) approves the
  # deployment in GitHub. Holds the signing identities and the ASC API key.
  sign-and-upload:
    needs: candidate
    runs-on: macos-15
    environment: app-store-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Match version input to the checked-out tree
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          source Packaging/VERSION
          if [ "$ROSTER_MARKETING_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Packaging/VERSION says $ROSTER_MARKETING_VERSION but dispatch asked for $EXPECTED_VERSION" >&2
            exit 1
          fi
      - name: Import signing identities into a dedicated keychain
        env:
          MAS_IDENTITIES_P12_B64: ${{ secrets.MAS_IDENTITIES_P12_B64 }}
          MAS_P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$MAS_IDENTITIES_P12_B64" | base64 -d > "$RUNNER_TEMP/mas-identities.p12"
          security import "$RUNNER_TEMP/mas-identities.p12" \
            -k "$KEYCHAIN" \
            -P "$MAS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/mas-identities.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
      - name: Restore the Mac App Store provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE_B64 }}
        run: |
          printf '%s' "$MAS_PROVISIONING_PROFILE_B64" | base64 -d \
            > "$RUNNER_TEMP/Bearoster_Mac_App_Store.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/Bearoster_Mac_App_Store.provisionprofile" > /dev/null
      - name: Build and sign the installer package
        env:
          ROSTER_MAS_PROFILE: ${{ runner.temp }}/Bearoster_Mac_App_Store.provisionprofile
        run: scripts/build-mas-pkg.sh
      - name: Upload the package to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_API_KEY_P8_B64" | base64 -d \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          source Packaging/VERSION
          xcrun altool --upload-app \
            --type macos \
            --file "dist/mas/Bearoster-$ROSTER_MARKETING_VERSION.pkg" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
      - name: Remove the dedicated keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
